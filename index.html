<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1b2f">
<meta name="robots" content="noindex">
<title>Il nostro invito</title>
<style>
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: #1b1b2f; color: #2b2b3a;
  font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
  font-weight: bold;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
}
#app {
  position: fixed; top: 0; bottom: 0; left: 50%;
  width: 100%; max-width: 62vh;
  -webkit-transform: translateX(-50%); transform: translateX(-50%);
  overflow: hidden; background: #5fb4f0;
}
#stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
canvas {
  display: block; width: 100%; height: 100%;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* HUD */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; font-size: 15px;
}
#barra { width: 150px; height: 12px; margin-top: 6px; background: #fff4dc; border: 2px solid #2b2b3a; }
#barra-pieno { height: 100%; width: 0; background: #d9423a; }
#super { width: 150px; height: 9px; margin-top: 4px; background: #fff4dc; border: 2px solid #2b2b3a; }
#super-pieno { height: 100%; width: 0; background: #f6c945; }
#super.attivo #super-pieno { background: #ff8a00; -webkit-animation: lampeggia .3s infinite; animation: lampeggia .3s infinite; }
#popup {
  position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; opacity: 0;
  font-size: 36px; color: #f6c945;
  text-shadow: 3px 3px 0 #2b2b3a, -2px -2px 0 #2b2b3a, 2px -2px 0 #2b2b3a, -2px 2px 0 #2b2b3a;
}
#popup.via { -webkit-animation: popup 1.1s ease-out; animation: popup 1.1s ease-out; }
@-webkit-keyframes popup {
  0% { opacity: 0; -webkit-transform: scale(.5); } 15% { opacity: 1; -webkit-transform: scale(1.2); }
  30% { -webkit-transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; -webkit-transform: translateY(-30px); }
}
@keyframes popup {
  0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.2); }
  30% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); }
}
#card-stelle { margin: 0 0 12px; font-size: 36px; letter-spacing: 6px; color: #f6c945; text-shadow: 2px 2px 0 #2b2b3a; }
#inv-premio { margin-top: 18px !important; padding: 12px; background: #fff; border: 3px solid #2b2b3a; white-space: pre-line; }
#hud-dx { display: flex; align-items: center; }
#hud-nome, #cuori { display: inline-block; padding: 3px 7px; background: #fff4dc; border: 2px solid #2b2b3a; }
#cuori { font-size: 18px; }
#cuori span { color: #d9423a; }
#audio {
  pointer-events: auto; margin-right: 12px; width: 40px; height: 40px; padding: 0;
  font-size: 20px; line-height: 1; background: #fff4dc; border: 2px solid #2b2b3a;
}
#audio.off { text-decoration: line-through; opacity: .55; }

/* Riquadri di testo */
#card {
  position: absolute; left: 20px; right: 20px; top: 20%;
  padding: 22px 16px; text-align: center;
  background: #fff4dc; border: 3px solid #2b2b3a; box-shadow: 6px 6px 0 #2b2b3a;
  pointer-events: none;
}
#card-titolo { margin: 0 0 14px; font-size: 26px; line-height: 1.2; color: #d9423a; }
#card-testo { margin: 0 0 16px; font-size: 18px; line-height: 1.45; white-space: pre-line; }
#card-tocco { margin: 0; font-size: 15px; color: #7a6a55; -webkit-animation: lampeggia 1.2s infinite; animation: lampeggia 1.2s infinite; }
@-webkit-keyframes lampeggia { 50% { opacity: .25; } }
@keyframes lampeggia { 50% { opacity: .25; } }

/* Pulsante salta */
#salta {
  position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  -webkit-transform: translateX(-50%); transform: translateX(-50%);
  padding: 13px 18px; font-size: 16px; white-space: nowrap;
  background: #fff4dc; border: 3px solid #2b2b3a; box-shadow: 4px 4px 0 #2b2b3a;
}

/* Invito */
#invito {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: #fff4dc; text-align: center;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(36px + env(safe-area-inset-bottom, 0px));
  -webkit-user-select: text; user-select: text;
}
#invito h1 { margin: 10px 0 6px; font-size: 34px; line-height: 1.2; color: #d9423a; }
#invito h2 { margin: 30px 0 10px; font-size: 15px; letter-spacing: 2px; color: #7a6a55; }
#invito p { margin: 6px 0; font-size: 18px; line-height: 1.45; }
#inv-saluto { font-size: 20px; }
.grande { font-size: 22px !important; }
#inv-programma { list-style: none; margin: 0; padding: 0; font-size: 18px; line-height: 1.9; }
#inv-programma b { color: #d9423a; margin-right: 10px; }
#inv-mappa { display: inline-block; margin-top: 10px; font-size: 17px; color: #2f6fd6; }
#rsvp { margin-top: 8px; text-align: left; }
#rsvp label { display: block; margin: 16px 0 6px; font-size: 16px; }
#rsvp input, #rsvp select, #rsvp textarea {
  width: 100%; padding: 12px; font-size: 18px; font-weight: normal;
  background: #fff; border: 3px solid #2b2b3a; border-radius: 0;
}
#rsvp textarea { min-height: 84px; resize: vertical; }
.scelta {
  display: inline-block; margin: 0 8px 8px 0; padding: 11px 13px; font-size: 16px;
  background: #fff; border: 3px solid #2b2b3a;
}
.scelta.si { background: #2b2b3a; color: #fff4dc; }
#f-chiave {
  width: 100%; margin-top: 12px; padding: 12px; font-size: 18px; font-weight: normal; text-align: center;
  background: #fff; border: 3px solid #2b2b3a; border-radius: 0;
}
#inv-apri {
  margin-top: 14px; padding: 14px 18px; font-size: 18px; color: #fff4dc;
  background: #d9423a; border: 3px solid #2b2b3a; box-shadow: 4px 4px 0 #2b2b3a;
}
#rsvp-errore { color: #d9423a; font-size: 16px; text-align: center; }
#wa {
  display: block; margin-top: 20px; padding: 16px 12px; text-align: center; text-decoration: none;
  font-size: 19px; color: #fff; background: #1f9d55; border: 3px solid #2b2b3a; box-shadow: 4px 4px 0 #2b2b3a;
}
#inv-numero { text-align: center; font-size: 17px !important; margin-top: 16px !important; }
#torna { margin-top: 34px; padding: 13px 18px; font-size: 16px; color: #fff4dc; background: #2b2b3a; border: 3px solid #2b2b3a; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="180" height="320"></canvas>
    <div id="card" hidden>
      <p id="card-titolo"></p>
      <p id="card-stelle" hidden></p>
      <p id="card-testo"></p>
      <p id="card-tocco"></p>
    </div>
    <div id="popup"></div>
  </div>

  <div id="hud">
    <div>
      <div id="hud-nome"></div>
      <div id="barra"><div id="barra-pieno"></div></div>
      <div id="super"><div id="super-pieno"></div></div>
    </div>
    <div id="hud-dx">
      <button id="audio" type="button" aria-label="Suono">&#9834;</button>
      <div id="cuori"><span>&#9829;</span> <b id="cuori-n">0</b></div>
    </div>
  </div>

  <button id="salta" type="button">Vai all'invito &gt;</button>

  <div id="invito" hidden>
    <p id="inv-saluto"></p>
    <h1 id="inv-sposi"></h1>
    <p>si sposano!</p>
    <p id="inv-premio"></p>

    <div id="inv-chiuso">
      <h2>DETTAGLI RISERVATI</h2>
      <p id="inv-chiave-msg">Per vedere data, luogo e programma serve la chiave che trovi nel messaggio di invito.</p>
      <input id="f-chiave" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Scrivi qui la chiave">
      <button id="inv-apri" type="button">Apri l'invito</button>
    </div>

    <div id="inv-dettagli" hidden>
    <h2>QUANDO</h2>
    <p class="grande" id="inv-data"></p>

    <h2>DOVE</h2>
    <p class="grande" id="inv-luogo"></p>
    <p id="inv-indirizzo"></p>
    <a id="inv-mappa" target="_blank" rel="noopener">Apri la mappa</a>

    <h2>PROGRAMMA</h2>
    <ul id="inv-programma"></ul>

    <h2>CONFERMA LA PRESENZA</h2>
    <p id="inv-entro"></p>
    <div id="rsvp">
      <label for="f-nome">Nome e cognome</label>
      <input id="f-nome" type="text" autocomplete="name" maxlength="60">
      <label for="f-persone">Quante persone?</label>
      <select id="f-persone"></select>
      <label id="l-allergeni">Intolleranze, allergie o diete? Tocca quelle che vi riguardano</label>
      <div id="f-allergeni" role="group" aria-labelledby="l-allergeni"></div>
      <label for="f-esigenze">Altre intolleranze o allergie (se siete in più persone, scrivi anche per chi)</label>
      <textarea id="f-esigenze" maxlength="300"></textarea>
      <label for="f-richieste">Richieste speciali per il rinfresco (menù bambini, seggiolone...)</label>
      <textarea id="f-richieste" maxlength="300"></textarea>
      <p id="rsvp-errore" hidden>Scrivi il tuo nome prima di confermare.</p>
      <a id="wa" target="_blank" rel="noopener">Conferma su WhatsApp</a>
      <p id="inv-numero"></p>
    </div>
    </div>

    <button id="torna" type="button">&lt; Torna al gioco</button>
  </div>
</div>

  var G = {
    stato: 'titolo', // titolo > intro > run > arrivo > finale > outro > fine
    li: 0, liv: null, strati: [], t: 0, scroll: 0, next: 0,
    ost: [], cuori: [], nCuori: 0, meta: null, fin: null,
    shake: 0, cardDa: 0, pausa: false,
    p: { x: PX, h: 0, vy: 0, vis: true, inv: 0, anim: 0 }
  };

  function ora() { return Date.now(); }

  function mostraCard(c) {
    $('card-titolo').textContent = c.titolo;
    $('card-testo').textContent = c.testo;
    $('card-stelle').hidden = !c.stelle;
    if (c.stelle) $('card-stelle').textContent = ['', '★☆☆', '★★☆', '★★★'][c.stelle];
    $('card-tocco').textContent = c.tocco;
    $('card').hidden = false;
    G.cardDa = ora() + 400; // evita che un tocco di troppo chiuda subito il riquadro
  }
  function nascondiCard() { $('card').hidden = true; }

  function caricaScenario(i) {
    var L = LEVELS[i];
    G.li = i; G.liv = L; G.strati = L.costruisci();
    G.t = 0; G.scroll = 0; G.next = 150; G.ost = []; G.cuori = []; G.meta = null; G.fin = null;
    G.presi = 0; G.generati = 0; G.serie = 0; G.super = 0; G.fx = [];
    // hw = mezza larghezza, alt = altezza, b = distanza dal bordo inferiore dello sprite
    G.p = { x: PX, h: 0, vy: 0, vis: true, inv: 0, anim: 0, hw: 5, alt: ALT_P, b: 0 };
    if (L.modo === 'volo') { G.p.x = 56; G.p.h = Math.round(GY * 0.5); G.p.hw = 20; G.p.alt = 12; G.p.b = 4; }
    if (L.modo === 'sentieri') { G.p.lane = 0; }
    if (L.modo === 'zigzag') { G.p.x = VW / 2; G.p.h = 34; G.p.hw = 9; G.p.alt = 20; G.p.b = 3; G.p.dir = 1; G.p.rot = 0; }
    $('hud-nome').textContent = (i + 1) + '/' + TOT_SCENARI + ' ' + L.nome;
    $('barra-pieno').style.width = '0%';
  }

  function avviaScenario(i) {
    caricaScenario(i);
    G.stato = 'intro';
    mostraCard(G.liv.intro());
  }

  function titolo() {
    G.nCuori = 0; $('cuori-n').textContent = '0';
    caricaScenario(0);
    G.stato = 'titolo';
    mostraCard({
      titolo: SPOSI + '\nsi sposano!',
      testo: (OSPITE ? 'Ciao ' + OSPITE + '!\n\n' : 'Ciao!\n\n') +
        'Prima però Alex deve raggiungere Nati in Patagonia. Gli dai una mano?',
      tocco: 'Tocca per iniziare'
    });
  }

  function tocco() {
    if (G.pausa) return;
    var s = G.stato;
    if (s === 'run') {
      if (G.liv.modo === 'volo') { G.p.vy = 125; nota(260, 0.08, 'triangle', 0.05, 340); }
      else if (G.liv.modo === 'sentieri') { G.p.lane = 1 - G.p.lane; SUONI.salto(); }        // cambia sentiero
      else if (G.liv.modo === 'zigzag') { G.p.dir = -G.p.dir; nota(300, 0.06, 'triangle', 0.05, 380); } // vira
      else if (G.p.h <= 0) { G.p.vy = SALTO; G.p.h = 0.01; SUONI.salto(); }
      return;
    }
    if (ora() < G.cardDa) return;
    if (s === 'titolo') { avviaScenario(0); }
    else if (s === 'intro') { nascondiCard(); G.stato = 'run'; }
    else if (s === 'outro') {
      if (LEVELS[G.li + 1]) { avviaScenario(G.li + 1); }
      else {
        // Fine del gioco: si apre l'invito. Sotto resta il riquadro per chi torna a giocare.
        apriInvito();
        G.stato = 'fine';
        mostraCard({
          titolo: 'GRAZIE!',
          testo: 'Cuori raccolti: ' + G.nCuori + '\nTitolo: ' + titoloPer(G.nCuori) +
            '\n\nVuoi fare di meglio?',
          tocco: 'Tocca per rigiocare'
        });
      }
    }
    else if (s === 'fine') { titolo(); }
  }

  function casuale(a, b) { return a + Math.random() * (b - a); }

  /* ---------- Ricompense ---------- */
  var SUPER_OGNI = 8;  // cuori da raccogliere per caricare il SUPER
  var SUPER_DUR = 5;   // secondi di SUPER: invincibile, calamita per i cuori, cuori doppi

  function titoloPer(n) {
    var t = CONFIG.titoli[0][1];
    CONFIG.titoli.forEach(function (r) { if (n >= r[0]) t = r[1]; });
    return t;
  }
  function popup(testo) {
    var e = $('popup');
    e.textContent = testo; e.className = '';
    void e.offsetWidth; // fa ripartire l'animazione
    e.className = 'via';
  }
  function nuovoCuore(x, h) { G.cuori.push({ x: x, h: h }); G.generati++; }
  function scintille(x, y, colore, n) {
    for (var i = 0; i < n; i++) {
      G.fx.push({ x: x, y: y, vx: casuale(-45, 45), vy: casuale(-70, -10), t: casuale(0.3, 0.6), col: colore });
    }
  }
  function prendiCuore(c) {
    var prima = G.nCuori;
    G.nCuori += G.super > 0 ? 2 : 1; G.presi++;
    $('cuori-n').textContent = G.nCuori;
    SUONI.cuore();
    scintille(c.x + 7, GY - c.h - 6, G.super > 0 ? '#f6c945' : '#d9423a', 5);
    if (G.super <= 0) {
      G.serie++;
      if (G.serie >= SUPER_OGNI) { G.serie = 0; G.super = SUPER_DUR; popup('SUPER!'); SUONI.super(); return; }
    }
    if (Math.floor(G.nCuori / 25) > Math.floor(prima / 25)) popup(Math.floor(G.nCuori / 25) * 25 + ' cuori!');
  }
  function disegnaAura() {
    if (G.super <= 0) return;
    var p = G.p, volo = G.liv.modo === 'volo', zig = G.liv.modo === 'zigzag';
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(p.anim * 20);
    cerchio(ctx, Math.round(p.x), Math.round(GY - p.h - (volo ? 10 : (zig ? 13 : 16))), volo ? 26 : 19, '#f6c945');
    ctx.globalAlpha = 1;
  }
  function disegnaFx() {
    for (var i = 0; i < G.fx.length; i++) {
      ctx.fillStyle = G.fx[i].col;
      ctx.fillRect(Math.round(G.fx[i].x), Math.round(G.fx[i].y), 2, 2);
    }
  }

  function genera() {
    var L = G.liv, key = L.ostacoli[Math.floor(Math.random() * L.ostacoli.length)];
    var x = VW + 20, gap = casuale(L.gapMin, L.gapMax);
    G.ost.push({ x: x, key: key, w: SPR[key].width, a: SPR[key].height, h: 0 });
    if (Math.random() < 0.7) nuovoCuore(x + 3, 44);        // sopra l'ostacolo: premia il salto
    if (Math.random() < 0.6) nuovoCuore(x + gap / 2, 8);   // a terra, a metà strada
    G.next = gap;
  }

  function aggiorna(dt) {
    var L = G.liv, p = G.p, s = G.stato, i;
    if (G.shake > 0) G.shake -= dt;
    if (p.inv > 0) p.inv -= dt;
    p.anim += dt;

    for (i = G.fx.length - 1; i >= 0; i--) { // scintille
      var f = G.fx[i];
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; f.t -= dt;
      if (f.t <= 0) G.fx.splice(i, 1);
    }
    for (i = G.ost.length - 1; i >= 0; i--) { // ostacoli spazzati via durante il SUPER
      if (G.ost[i].via) { G.ost[i].x += 300 * dt; G.ost[i].h += 220 * dt; if (G.ost[i].x > VW + 40) G.ost.splice(i, 1); }
      else if (G.ost[i].amp) { G.ost[i].h = G.ost[i].h0 + Math.sin(p.anim * 2 + G.ost[i].fase) * G.ost[i].amp; } // mongolfiere
      else if (G.ost[i].vx) { // deriva laterale (scenario visto dall'alto)
        G.ost[i].x += G.ost[i].vx * dt;
        if (G.ost[i].x < 4 || G.ost[i].x > VW - G.ost[i].w - 4) G.ost[i].vx = -G.ost[i].vx;
      }
    }

    if (s === 'run' || s === 'arrivo') {
      var d = L.vel * dt;
      G.scroll += d;
      if (L.modo === 'zigzag') { // qui tutto scorre dall'alto verso il basso
        for (i = G.ost.length - 1; i >= 0; i--) { G.ost[i].h -= d; if (G.ost[i].h < -TERRA - 30) G.ost.splice(i, 1); }
        for (i = G.cuori.length - 1; i >= 0; i--) { G.cuori[i].h -= d; if (G.cuori[i].h < -TERRA - 20) G.cuori.splice(i, 1); }
      } else {
        for (i = G.ost.length - 1; i >= 0; i--) { G.ost[i].x -= d; if (G.ost[i].x < -30) G.ost.splice(i, 1); }
        for (i = G.cuori.length - 1; i >= 0; i--) { G.cuori[i].x -= d; if (G.cuori[i].x < -20) G.cuori.splice(i, 1); }
      }
    }

    if (L.modo === 'sentieri') { // Alex si sposta in fretta verso il sentiero scelto
      var quota = p.lane * L.quota;
      if (p.h < quota) p.h = Math.min(quota, p.h + 260 * dt);
      else if (p.h > quota) p.h = Math.max(quota, p.h - 260 * dt);
    } else if (L.modo === 'zigzag') {
      if (s === 'run') { // l'aereo scivola di lato e rimbalza ai bordi
        p.x += p.dir * 75 * dt;
        if (p.x < 14) { p.x = 14; p.dir = 1; }
        if (p.x > VW - 14) { p.x = VW - 14; p.dir = -1; }
      }
      p.rot += ((s === 'run' ? p.dir * 0.3 : 0) - p.rot) * Math.min(1, dt * 10);
    } else if (L.modo === 'volo') {
      if (s === 'run') { // l'aereo scende piano, ogni tocco lo fa risalire
        p.vy = Math.max(-90, p.vy - 260 * dt); p.h += p.vy * dt;
        var tetto = GY - 52;
        if (p.h > tetto) { p.h = tetto; if (p.vy > 0) p.vy = 0; }
        if (p.h < 10) { p.h = 10; if (p.vy < 0) p.vy = 0; }
      } else if (s !== 'finale') { p.vy = 0; }
    } else if (p.h > 0) { // salto
      p.vy -= GRAV * dt; p.h += p.vy * dt;
      if (p.h <= 0) { p.h = 0; p.vy = 0; }
    }

    if (s === 'run') {
      G.t += dt;
      if (G.t < L.durata - 2.5) { G.next -= L.vel * dt; if (G.next <= 0) (L.genera || genera)(); }
      else if (G.t >= L.durata) { G.stato = 'arrivo'; G.meta = L.metaIni ? L.metaIni() : { x: VW + 20, h: 0, rot: 0 }; G.super = 0; }

      if (G.super > 0) {
        G.super -= dt;
        if (Math.random() < 0.5) scintille(p.x + casuale(-p.hw, p.hw), GY - p.h - casuale(0, 28), '#f6c945', 1);
      }
      var carica = Math.round((G.super > 0 ? G.super / SUPER_DUR : G.serie / SUPER_OGNI) * 100) + '%';
      if ($('super-pieno').style.width !== carica) $('super-pieno').style.width = carica;
      $('super').className = G.super > 0 ? 'attivo' : '';

      for (i = G.cuori.length - 1; i >= 0; i--) {
        var c = G.cuori[i];
        if (G.super > 0) { // calamita: i cuori vicini volano verso il giocatore
          var dx = p.x - (c.x + 7), dy = (p.h + p.b + p.alt / 2) - (c.h + 6);
          if (dx * dx + dy * dy < 80 * 80) { c.x += dx * 7 * dt; c.h += dy * 7 * dt; }
        }
        if (c.x < p.x + p.hw + 2 && c.x + 14 > p.x - p.hw - 2 && c.h < p.h + p.b + p.alt && c.h + 12 > p.h + p.b) {
          G.cuori.splice(i, 1); prendiCuore(c);
        }
      }
      if (p.inv <= 0 || G.super > 0) {
        for (i = 0; i < G.ost.length; i++) {
          var o = G.ost[i];
          // Nessun game over: Alex inciampa, lampeggia e prosegue
          if (o.x + 2 < p.x + p.hw && o.x + o.w - 2 > p.x - p.hw &&
              p.h + p.b < o.h + o.a - 3 && p.h + p.b + p.alt > o.h + 2) {
            if (o.via) continue;
            if (G.super > 0) { // durante il SUPER gli ostacoli volano via
              o.via = true; nota(500, 0.12, 'square', 0.05, 1000);
              scintille(o.x + o.w / 2, GY - o.h - o.a / 2, '#ffffff', 8);
              continue;
            }
            p.inv = 1.1; G.shake = 0.15; SUONI.urto();
            G.serie = Math.max(0, G.serie - 3); // un urto fa perdere un po' di carica
            break;
          }
        }
      }
      $('barra-pieno').style.width = Math.min(100, G.t / L.durata * 100) + '%';
    } else if (s === 'arrivo' && L.arrivo) { // arrivo su misura dello scenario
      if (L.arrivo(dt)) { G.stato = 'finale'; G.fin = { t: 0, fase: 0 }; }
    } else if (s === 'arrivo') {
      G.meta.x -= L.vel * dt;
      var stop = L.metaStop || 110;
      if (G.meta.x <= stop) { G.meta.x = stop; G.stato = 'finale'; G.fin = { t: 0, fase: 0 }; }
    } else if (s === 'finale') {
      if (L.finale(dt)) {
        // Stelle in base alla quota di cuori presi nello scenario
        var fine = L.outro(), quota = G.generati ? G.presi / G.generati : 0;
        fine.stelle = quota >= 0.7 ? 3 : (quota >= 0.4 ? 2 : 1);
        fine.testo += '\n\nCuori presi: ' + G.presi + ' su ' + G.generati;
        G.stato = 'outro'; SUONI.fanfara(); mostraCard(fine);
      }
    }
  }

  function disegna() {
    var L = G.liv, p = G.p, i;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (G.shake > 0) ctx.translate(Math.round(casuale(-1.5, 1.5)), Math.round(casuale(-1.5, 1.5)));

    var banda = Math.ceil(GY / L.cielo.length);
    for (i = 0; i < L.cielo.length; i++) { ctx.fillStyle = L.cielo[i]; ctx.fillRect(-2, i * banda - 2, VW + 4, banda + 2); }
    if (L.extra) L.extra(ctx);

    for (i = 0; i < G.strati.length; i++) {
      var st = G.strati[i];
      var y = st.top != null ? st.top : GY - st.base - st.img.height;
      var x = -Math.floor((G.scroll * st.f) % VW);
      ctx.drawImage(st.img, x, y);
      ctx.drawImage(st.img, x + VW, y);
    }

    if (G.meta) {
      var m = G.meta, im = SPR[L.meta];
      ctx.save();
      ctx.translate(Math.round(m.x + im.width / 2), Math.round(GY + (L.metaGiu || 1) - m.h - im.height / 2));
      ctx.rotate(m.rot);
      ctx.drawImage(im, -im.width / 2, -im.height / 2);
      ctx.restore();
    }
    for (i = 0; i < G.ost.length; i++) {
      var o = G.ost[i];
      ctx.drawImage(SPR[o.key], Math.round(o.x), Math.round(GY - o.h - o.a));
    }
    for (i = 0; i < G.cuori.length; i++) {
      var c = G.cuori[i];
      ctx.drawImage(SPR.cuore, Math.round(c.x), Math.round(GY - c.h - 12 + Math.sin(p.anim * 6 + c.x * 0.1) * 1.5));
    }
    disegnaAura();

    if (L.modo === 'zigzag') {
      if (!(p.inv > 0 && Math.floor(p.inv * 12) % 2)) {
        ctx.save();
        ctx.translate(Math.round(p.x), Math.round(GY - p.h - 13));
        ctx.rotate(p.rot);
        ctx.drawImage(SPR.aereoSu, -13, -13);
        ctx.restore();
      }
    } else if (L.modo === 'volo') {
      if (!(p.inv > 0 && Math.floor(p.inv * 12) % 2)) {
        var inAria = G.stato === 'intro' || G.stato === 'run' || G.stato === 'arrivo';
        ctx.save();
        ctx.translate(Math.round(p.x), Math.round(GY - p.h - 10 + (inAria ? Math.sin(p.anim * 4) * 1.5 : 0)));
        ctx.rotate(Math.max(-0.3, Math.min(0.3, -p.vy / 380)));
        ctx.drawImage(SPR.aereo, -28, -10);
        ctx.restore();
      }
    } else if (p.vis && !(p.inv > 0 && Math.floor(p.inv * 12) % 2)) {
      var fermo = G.stato === 'titolo' || G.stato === 'intro' || G.stato === 'outro' || G.stato === 'fine' ||
        (G.stato === 'finale' && G.fin.fase === 1);
      var inSalto = L.modo === 'sentieri' ? p.h !== p.lane * L.quota : p.h > 0;
      var img = inSalto ? SPR.alex3 : (fermo ? SPR.alex2 : (Math.floor(p.anim * 8) % 2 ? SPR.alex2 : SPR.alex1));
      ctx.drawImage(img, Math.round(p.x - 12), Math.round(GY - p.h - 32));
    }
    if (L.sopra) L.sopra(ctx);
    disegnaFx();
  }

  /* ---------- Dimensioni: riempie lo schermo in verticale ---------- */
  function ridimensiona() {
    var app = $('app');
    var r = app.clientHeight / Math.max(1, app.clientWidth);
    VH = Math.max(260, Math.min(420, Math.round(VW * r)));
    GY = VH - TERRA;
    cv.width = VW; cv.height = VH;
    ctx.imageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;
    if (G.liv) disegna();
  }
  window.addEventListener('resize', ridimensiona);
  window.addEventListener('orientationchange', function () { setTimeout(ridimensiona, 250); });

  /* ---------- Ciclo di gioco ---------- */
  var ultimo = 0;
  var raf = window.requestAnimationFrame || function (f) { return setTimeout(function () { f(ora()); }, 16); };
  function ciclo(ts) {
    raf(ciclo);
    var dt = Math.min(0.05, (ts - ultimo) / 1000 || 0);
    ultimo = ts;
    if (G.pausa) return;
    aggiorna(dt);
    disegna();
  }

  /* ---------- Comandi: un solo tocco ---------- */
  var stage = $('stage');
  stage.addEventListener('touchstart', function (e) { e.preventDefault(); tocco(); }, { passive: false });
  stage.addEventListener('mousedown', function (e) { e.preventDefault(); tocco(); });
  document.addEventListener('keydown', function (e) {
    if (!$('invito').hidden) return;
    if (e.keyCode === 32 || e.keyCode === 38) { e.preventDefault(); tocco(); }
  });
  $('audio').addEventListener('click', function () {
    muto = !muto;
    this.className = muto ? 'off' : '';
  });

  /* ---------- Invito ---------- */
  function apriInvito() {
    G.pausa = true;
    $('invito').hidden = false;
    $('salta').hidden = true;
    $('invito').scrollTop = 0;
    $('inv-premio').textContent = G.nCuori > 0
      ? 'Hai raccolto ' + G.nCuori + ' cuori.\nIl tuo titolo: ' + titoloPer(G.nCuori)
      : 'Gioca e raccogli i cuori per guadagnare il tuo titolo!';
    aggiornaWA();
  }
  function chiudiInvito() {
    $('invito').hidden = true;
    $('salta').hidden = false;
    G.pausa = false;
  }
  $('salta').addEventListener('click', apriInvito);
  $('torna').addEventListener('click', chiudiInvito);

  $('inv-saluto').textContent = conNome('Ciao {nome}!', 'Ciao!');
  $('inv-sposi').textContent = SPOSI;
  // Riempie i dettagli riservati: viene chiamata solo dopo aver decifrato i dati
  function riempiInvito() {
  $('inv-programma').innerHTML = '';
  $('inv-data').textContent = CONFIG.data;
  $('inv-luogo').textContent = CONFIG.luogo;
  $('inv-indirizzo').textContent = CONFIG.indirizzo;
  if (CONFIG.mappa) $('inv-mappa').href = CONFIG.mappa; else $('inv-mappa').hidden = true;
  CONFIG.programma.forEach(function (r) {
    var li = document.createElement('li'), b = document.createElement('b');
    b.textContent = r[0];
    li.appendChild(b); li.appendChild(document.createTextNode(r[1]));
    $('inv-programma').appendChild(li);
  });
  $('inv-entro').textContent = 'Facci sapere entro ' + CONFIG.rispostaEntro + '.';
  $('inv-numero').textContent = 'Non usi WhatsApp? Chiama o scrivi al +' + CONFIG.whatsapp;
  $('inv-chiuso').hidden = true;
  $('inv-dettagli').hidden = false;
  aggiornaWA();
  }

  /* ---------- Dati riservati: nel file sono cifrati, si aprono solo con la chiave ---------- */
  function daBase64(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  function normChiave(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
  function sblocca(chiave, fatto) {
    var sub = window.crypto && (window.crypto.subtle || window.crypto.webkitSubtle);
    if (!SEGRETO) { fatto(false, 'vuoto'); return; }
    if (!sub || !window.TextEncoder || !window.Promise) { fatto(false, 'browser'); return; }
    try {
      sub.importKey('raw', new TextEncoder().encode(normChiave(chiave)), 'PBKDF2', false, ['deriveKey'])
        .then(function (k) {
          return sub.deriveKey({ name: 'PBKDF2', salt: daBase64(SEGRETO.s), iterations: SEGRETO.n, hash: 'SHA-256' },
            k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        })
        .then(function (k) { return sub.decrypt({ name: 'AES-GCM', iv: daBase64(SEGRETO.i) }, k, daBase64(SEGRETO.d)); })
        .then(function (buf) {
          var dati = JSON.parse(new TextDecoder().decode(buf));
          for (var k in dati) CONFIG[k] = dati[k];
          riempiInvito();
          fatto(true);
        })
        ['catch'](function () { fatto(false, 'chiave'); });
    } catch (e) { fatto(false, 'browser'); }
  }
  function provaChiave(chiave, daLink) {
    if (!chiave) return;
    var msg = $('inv-chiave-msg');
    msg.textContent = 'Apro l\'invito...';
    sblocca(chiave, function (ok, perche) {
      if (ok) { // tiene la chiave nel link, così ricaricando la pagina l'invito resta aperto
        try { history.replaceState(null, '', location.pathname + location.search + '#' + encodeURIComponent(normChiave(chiave))); } catch (e) {}
        return;
      }
      msg.textContent = perche === 'browser'
        ? 'Questo browser non riesce ad aprire l\'invito. Prova con un altro browser o scrivi agli sposi.'
        : perche === 'vuoto' ? 'I dettagli non sono ancora stati caricati.'
        : daLink ? 'Il link non contiene una chiave valida. Scrivi qui sotto quella che trovi nel messaggio di invito.'
        : 'Chiave non corretta. Controlla il messaggio di invito.';
    });
  }
  $('inv-apri').addEventListener('click', function () { provaChiave($('f-chiave').value, false); });
  $('f-chiave').addEventListener('keydown', function (e) { if (e.keyCode === 13) provaChiave(this.value, false); });

  var fNome = $('f-nome'), fPersone = $('f-persone'), fEsigenze = $('f-esigenze'), wa = $('wa');
  for (var n = 1; n <= CONFIG.maxPersone; n++) {
    var op = document.createElement('option');
    op.value = n; op.textContent = n;
    fPersone.appendChild(op);
  }
  fNome.value = OSPITE;

  // Pulsanti a scelta multipla per intolleranze, allergie e diete
  var fRichieste = $('f-richieste'), scelte = [];
  CONFIG.allergeni.forEach(function (voce) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'scelta'; b.textContent = voce;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      var i = scelte.indexOf(voce);
      if (i < 0) scelte.push(voce); else scelte.splice(i, 1);
      b.className = i < 0 ? 'scelta si' : 'scelta';
      b.setAttribute('aria-pressed', i < 0 ? 'true' : 'false');
      aggiornaWA();
    });
    $('f-allergeni').appendChild(b);
  });

  // Il link WhatsApp viene ricalcolato a ogni modifica dei campi
  function aggiornaWA() {
    if (!CONFIG.whatsapp) return; // invito ancora chiuso
    var msg = 'Ciao ' + CONFIG.sposi.join(' e ') + '! Confermo la presenza al vostro matrimonio.\n' +
      'Nome: ' + fNome.value.trim() + '\n' +
      'Persone: ' + fPersone.value + '\n' +
      'Intolleranze, allergie o diete: ' + (scelte.length ? scelte.join(', ') : 'nessuna') +
      (fEsigenze.value.trim() ? '\nAltre intolleranze o allergie: ' + fEsigenze.value.trim() : '') +
      (fRichieste.value.trim() ? '\nRichieste per il rinfresco: ' + fRichieste.value.trim() : '') +
      (G.nCuori > 0 ? '\nCuori raccolti nel gioco: ' + G.nCuori + ' (' + titoloPer(G.nCuori) + ')' : '');
    wa.href = 'https://wa.me/' + CONFIG.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
    if (fNome.value.trim()) $('rsvp-errore').hidden = true;
  }
  [fNome, fPersone, fEsigenze, fRichieste].forEach(function (el) {
    el.addEventListener('input', aggiornaWA);
    el.addEventListener('change', aggiornaWA);
  });
  wa.addEventListener('click', function (e) {
    aggiornaWA();
    if (!fNome.value.trim()) { e.preventDefault(); $('rsvp-errore').hidden = false; fNome.focus(); }
  });
  aggiornaWA();

  // La chiave arriva dal link, dopo il simbolo #. Quella parte non viene inviata al server.
  var chiaveLink = '';
  try { chiaveLink = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) {}
  provaChiave(chiaveLink, true);

  /* ---------- Avvio ---------- */
  ridimensiona();
  titolo();
  // Solo per i test: ?scena=italia salta il titolo
  for (var k = 0; k < LEVELS.length; k++) {
    if (LEVELS[k].key === (QS.scena || '').toLowerCase()) { G.cardDa = 0; avviaScenario(k); }
  }
  disegna();
  raf(ciclo);

  // Aggancio per i test automatici
  window.__gioco = { G: G, aggiorna: aggiorna, disegna: disegna, tocco: tocco };
})();
</script>
</body>
</html>
